name: Temporary formatter
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a081ce-aniyomi-fr-unified
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :src:fr:frunified:spotlessApply > format-ci.log 2>&1 || true
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src/fr/frunified format-ci.log
          git diff --cached --quiet || git commit -m 'style: apply Spotless formatting'
          git push origin HEAD:arena/01a081ce-aniyomi-fr-unified
