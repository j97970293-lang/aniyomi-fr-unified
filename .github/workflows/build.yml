name: Build FR Unified

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and check formatting
        run: |
          chmod +x gradlew
          ./gradlew :src:fr:frunified:spotlessCheck :src:fr:frunified:testDebugUnitTest :src:fr:frunified:lintDebug :src:fr:frunified:assembleDebug

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: fr-unified-aniyomi-debug
          path: src/fr/frunified/build/outputs/apk/debug/*.apk
          if-no-files-found: error
