name: Build FR Unified

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and check formatting
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :src:fr:frunified:spotlessCheck :src:fr:frunified:testDebugUnitTest :src:fr:frunified:lintDebug :src:fr:frunified:assembleDebug 2>&1 | tee gradle-ci.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::gradle failure tail"
            tail -n 80 gradle-ci.log
            echo "::endgroup::"
            python3 - <<'PY'
          from pathlib import Path
          lines = Path("gradle-ci.log").read_text(errors="replace").splitlines()
          interesting = [line for line in lines if any(token in line for token in (
              "FAILED", "Error", "error:", "Violation", "spotless", "ktlint", "e: ", "What went wrong",
          ))][-40:]
          if not interesting:
              interesting = lines[-40:]
          for line in interesting:
              text = line.replace("%", "%25").replace("\r", "").strip()[:240]
              if text:
                  print(f"::error::{text}")
          PY
            exit "$status"
          fi

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: fr-unified-aniyomi-debug
          path: src/fr/frunified/build/outputs/apk/debug/*.apk
          if-no-files-found: error
