name: Build FR Unified

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and check formatting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x gradlew
          if ! ./gradlew :src:fr:frunified:spotlessCheck :src:fr:frunified:testDebugUnitTest :src:fr:frunified:lintDebug :src:fr:frunified:assembleDebug > /tmp/build.log 2>&1; then
            cat /tmp/build.log
            ERR=$(tail -n 120 /tmp/build.log)
            gh pr comment 6 --body "### CI Build Failure Log
\`\`\`
$ERR
\`\`\`" || true
            exit 1
          fi

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: fr-unified-aniyomi-debug
          path: src/fr/frunified/build/outputs/apk/debug/*.apk
          if-no-files-found: error
