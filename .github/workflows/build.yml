name: Build FR Unified

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Auto format and verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew

          echo "Applying spotless..."
          ./gradlew :src:fr:frunified:spotlessApply || true

          if [ -n "$(git status --porcelain)" ]; then
            echo "Spotless made formatting changes. Committing and pushing..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: apply spotless formatting"
            git push origin HEAD:${{ github.head_ref || github.ref_name }} || true
          fi

          echo "Running spotlessCheck..."
          ./gradlew :src:fr:frunified:spotlessCheck

          echo "Running unit tests..."
          if ! ./gradlew :src:fr:frunified:testDebugUnitTest; then
            echo "Unit tests failed!"
            find . -path "*/build/test-results/*" -name "*.xml" -exec cat {} + || true
            exit 1
          fi

          echo "Running lint..."
          ./gradlew :src:fr:frunified:lintDebug

          echo "Running assemble..."
          ./gradlew :src:fr:frunified:assembleDebug

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: fr-unified-aniyomi-debug
          path: src/fr/frunified/build/outputs/apk/debug/*.apk
          if-no-files-found: error
