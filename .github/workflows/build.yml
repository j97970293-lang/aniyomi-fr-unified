name: Build FR Unified

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and check formatting
        run: |
          chmod +x gradlew
          
          run_cmd() {
            local title="$1"
            local cmd="$2"
            echo "Running $title..."
            if ! eval "$cmd" > /tmp/cmd.log 2>&1; then
              cat /tmp/cmd.log
              local err_sample
              err_sample=$(tail -n 15 /tmp/cmd.log | tr '\n' ' ')
              echo "::error title=$title failed::$err_sample"
              exit 1
            fi
          }

          run_cmd "spotlessCheck" "./gradlew :src:fr:frunified:spotlessCheck"
          run_cmd "testDebugUnitTest" "./gradlew :src:fr:frunified:testDebugUnitTest"
          run_cmd "lintDebug" "./gradlew :src:fr:frunified:lintDebug"
          run_cmd "assembleDebug" "./gradlew :src:fr:frunified:assembleDebug"

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: fr-unified-aniyomi-debug
          path: src/fr/frunified/build/outputs/apk/debug/*.apk
          if-no-files-found: error
