name: Check logs

on:
  push:
    branches:
      - "arena/01a08269-aniyomi-fr-unified"
    paths-ignore:
      - ".spotless-log.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  spotless:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: arena/01a08269-aniyomi-fr-unified

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Spotless check and auto-fix
        run: |
          chmod +x gradlew
          if ./gradlew :src:fr:frunified:spotlessCheck > /tmp/spotless.log 2>&1; then
            echo '## spotlessCheck OK' >> "$GITHUB_STEP_SUMMARY"
            tail -n 5 /tmp/spotless.log > .spotless-log.txt
          else
            echo '## spotlessCheck FAILED — applying spotlessApply' >> "$GITHUB_STEP_SUMMARY"
            tail -n 250 /tmp/spotless.log >> "$GITHUB_STEP_SUMMARY"
            ./gradlew :src:fr:frunified:spotlessApply > /tmp/spotless-apply.log 2>&1 || true
            {
              echo '## apply'
              echo '```'
              tail -n 40 /tmp/spotless-apply.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            {
              echo '## CHECK LOG (tail 250)'
              tail -n 250 /tmp/spotless.log
              echo '## APPLY DIFF'
              git diff --stat
            } > .spotless-log.txt
          fi

      - name: Commit applied fixes
        if: always()
        run: |
          git config user.email "arena-ai-coding-agent@users.noreply.github.com"
          git config user.name "arena-ai-coding-agent"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Spotless auto-fix"
          git push origin HEAD:arena/01a08269-aniyomi-fr-unified

      - name: Fail on spotless failure
        run: |
          grep -q "BUILD FAILED" /tmp/spotless.log && exit 1
          exit 0

# Déclenché par push sur la branche arena (fichiers hors .spotless-log.txt).
