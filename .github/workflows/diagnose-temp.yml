name: Temporary diagnostics
on: push
permissions:
  contents: write
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a081ce-aniyomi-fr-unified
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :src:fr:frunified:spotlessCheck :src:fr:frunified:testDebugUnitTest :src:fr:frunified:lintDebug :src:fr:frunified:assembleDebug > build-ci.log 2>&1 || true
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add build-ci.log
          git commit -m 'ci: capture build diagnostics' || true
          git push origin HEAD:arena/01a081ce-aniyomi-fr-unified
