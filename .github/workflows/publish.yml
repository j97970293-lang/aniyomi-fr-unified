name: Publish Aniyomi repository

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY" || { echo "Missing SIGNING_KEY secret"; exit 1; }
          printf '%s' "$SIGNING_KEY" | base64 --decode > signingkey.jks

      - name: Build signed APK
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :src:fr:frunified:spotlessCheck :src:fr:frunified:assembleRelease 2>&1 | tee /tmp/build.log | tail -n 80

      - name: Commit build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          tail -n 300 /tmp/build.log > .publish-log.txt
          B64=$(base64 -w0 .publish-log.txt)
          printf '{"content":"%s","encoding":"base64"}' "$B64" > /tmp/blob.json
          BLOB_SHA=$(gh api repos/$GITHUB_REPOSITORY/git/blobs -X POST --input /tmp/blob.json --jq .sha)
          printf '{"tree":[{"path":".publish-log.txt","mode":"100644","sha":"%s"}]}' "$BLOB_SHA" > /tmp/tree.json
          TREE_SHA=$(gh api repos/$GITHUB_REPOSITORY/git/trees -X POST --input /tmp/tree.json --jq .sha)
          printf '{"message":"Publish build log %s","tree":"%s"}' "$GITHUB_SHA" "$TREE_SHA" > /tmp/commit.json
          COMMIT_SHA=$(gh api repos/$GITHUB_REPOSITORY/git/commits -X POST --input /tmp/commit.json --jq .sha)
          printf '{"ref":"refs/heads/publish-debug","sha":"%s","force":true}' "$COMMIT_SHA" > /tmp/ref.json
          gh api repos/$GITHUB_REPOSITORY/git/refs/heads/publish-debug -X PUT --input /tmp/ref.json
          echo "LOG_COMMIT=$COMMIT_SHA"

      - name: Create extension repository
        run: |
          APK=$(find src/fr/frunified/build/outputs/apk/release -name '*.apk' -print -quit)
          python3 tools/create-repo.py "$APK" public \
            --name "FR Unifié" \
            --website "https://github.com/${GITHUB_REPOSITORY}"
          cp README.md public/README.md

      - name: Publish repo branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: repo
          publish_dir: public
          force_orphan: true

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: fr-unified-aniyomi-release
          path: src/fr/frunified/build/outputs/apk/release/*.apk
          if-no-files-found: error
